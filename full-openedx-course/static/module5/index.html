<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 5: Designing AI Automation Solutions & Common Use Cases</title>
<style>

/* ═══ RESET & BASE ═══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f8fafc;color:#1e293b;line-height:1.6;min-height:100vh}
button{cursor:pointer;font-family:inherit;border:none;background:none}
img{max-width:100%;height:auto;display:block;border-radius:12px}

/* ═══ VARIABLES ═══ */
:root{
  --cyan:#0891b2;--cyan-light:#ecfeff;--cyan-border:#a5f3fc;
  --emerald:#059669;--emerald-light:#ecfdf5;
  --violet:#7c3aed;--violet-light:#f5f3ff;
  --amber:#d97706;--amber-light:#fffbeb;
  --red:#dc2626;--red-light:#fef2f2;
  --slate:#64748b;--slate-light:#f1f5f9;
  --white:#fff;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.1);
}
[dir="rtl"] body{font-family:'Segoe UI',system-ui,sans-serif}

/* ═══ LAYOUT ═══ */
.app{max-width:900px;margin:0 auto;padding:12px}
.card{background:var(--white);border:1px solid #e2e8f0;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-header{padding:12px 16px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-body{padding:16px;min-height:400px}
.card-footer{padding:10px 16px;border-top:1px solid #e2e8f0;background:#f8fafc;display:flex;align-items:center;justify-content:space-between}

/* ═══ HEADER / TOOLBAR ═══ */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.toolbar h1{font-size:14px;font-weight:700;color:#0f172a;flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.badge-cyan{background:var(--cyan-light);color:var(--cyan)}
.badge-emerald{background:var(--emerald-light);color:var(--emerald)}
.badge-amber{background:var(--amber-light);color:var(--amber)}
.badge-violet{background:var(--violet-light);color:var(--violet)}
.lang-btn{padding:4px 12px;border-radius:8px;font-size:11px;font-weight:700;border:1px solid #e2e8f0;background:var(--white);color:var(--slate);transition:.2s}
.lang-btn:hover{background:var(--slate-light)}

/* ═══ PROGRESS BAR ═══ */
.progress-bar{height:6px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#06b6d4,#0284c7);transition:width .5s ease}

/* ═══ NAV DOTS ═══ */
.nav-dots{display:flex;gap:3px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.nav-dot{width:8px;height:8px;border-radius:50%;background:#e2e8f0;border:none;transition:.2s;cursor:pointer}
.nav-dot.active{background:var(--cyan);transform:scale(1.3)}
.nav-dot.visited{background:#a5f3fc}
.nav-dot.section-slide{background:#e2e8f0}
.nav-dot.section-activity{background:#fde68a}
.nav-dot.section-quiz{background:#a7f3d0}

/* ═══ BUTTONS ═══ */
.btn{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--cyan);color:var(--white);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn-primary:hover{background:#0e7490}
.btn-primary:disabled{background:#94a3b8;cursor:not-allowed}
.btn-outline{border:1px solid #e2e8f0;color:var(--slate);background:var(--white)}
.btn-outline:hover{background:var(--slate-light)}
.btn-outline:disabled{opacity:.4;cursor:not-allowed}
.btn-success{background:var(--emerald);color:var(--white)}
.btn-amber{background:var(--amber);color:var(--white)}

/* ═══ GRID ═══ */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid-2{grid-template-columns:1fr}}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:640px){.grid-3{grid-template-columns:1fr}}

/* ═══ SLIDE ELEMENTS ═══ */
.slide-title{font-size:22px;font-weight:800;color:#0f172a;margin-bottom:6px;line-height:1.3}
.slide-subtitle{font-size:14px;color:var(--slate);margin-bottom:12px}
.info-box{padding:12px;border-radius:var(--radius);margin-bottom:12px;font-size:13px;line-height:1.7}
.info-box.cyan{background:var(--cyan-light);border:1px solid var(--cyan-border);color:#155e75}
.info-box.violet{background:var(--violet-light);border:1px solid #c4b5fd;color:#5b21b6}
.info-box.amber{background:var(--amber-light);border:1px solid #fcd34d;color:#92400e}
.info-box.emerald{background:var(--emerald-light);border:1px solid #6ee7b7;color:#065f46}
.info-box.red{background:var(--red-light);border:1px solid #fca5a5;color:#991b1b}
.info-box.slate{background:var(--slate-light);border:1px solid #cbd5e1;color:#334155}

.chip{display:inline-flex;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:500;background:var(--slate-light);color:var(--slate);border:1px solid #e2e8f0;margin:3px}
.tag{display:inline-flex;padding:4px 14px;background:var(--slate-light);border-radius:12px;font-size:12px;font-weight:500;color:var(--slate);border:1px solid #e2e8f0}

/* ═══ INTERACTIVE CARDS ═══ */
.click-card{padding:12px;border-radius:var(--radius);border:2px solid #e2e8f0;cursor:pointer;transition:.2s;text-align:left}
[dir="rtl"] .click-card{text-align:right}
.click-card:hover{border-color:var(--cyan);box-shadow:var(--shadow)}
.click-card.active{background:var(--cyan-light);border-color:var(--cyan)}
.click-card .card-title{font-size:13px;font-weight:700;color:#0f172a;margin-bottom:4px}
.click-card .card-desc{font-size:11px;color:var(--slate);line-height:1.5;overflow:hidden;max-height:0;transition:.3s}
.click-card.active .card-desc{max-height:100px}

.icon-box{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--white);flex-shrink:0}

/* Flip card */
.flip-card-btn{padding:10px;border-radius:var(--radius);border:2px solid #e2e8f0;cursor:pointer;transition:.3s;text-align:center;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.flip-card-btn.flipped{background:var(--cyan);border-color:var(--cyan);color:var(--white)}
.flip-card-btn .flip-icon{font-size:22px;margin-bottom:4px}
.flip-card-btn .flip-label{font-size:11px;font-weight:600}
.flip-card-btn .flip-desc{font-size:11px}

/* Process steps */
.step-row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.step-box{flex:1;min-width:60px;padding:6px;border-radius:8px;text-align:center;font-size:10px;font-weight:600;transition:.4s;background:#e2e8f0;color:var(--slate)}
.step-box.active{transform:scale(1.05);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.step-box.done{opacity:.85}
.step-arrow{font-size:12px;color:#cbd5e1}

/* Flow selector */
.flow-tab{flex:1;padding:6px;border-radius:8px;font-size:11px;font-weight:700;transition:.2s;background:var(--slate-light);color:var(--slate);text-align:center}
.flow-tab.active{background:var(--violet);color:var(--white)}

/* ═══ MATCH ACTIVITY ═══ */
.match-pool{display:flex;flex-direction:column;gap:6px}
.match-item{padding:10px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.2s;border:2px solid transparent;user-select:none}
.match-item.left{background:#f0f9ff;border-color:#bae6fd;color:#0c4a6e}
.match-item.left.selected{background:#06b6d4;color:#fff;border-color:#06b6d4}
.match-item.right{background:#faf5ff;border-color:#d8b4fe;color:#581c87}
.match-item.right.selected{background:#7c3aed;color:#fff;border-color:#7c3aed}
.match-item.correct{background:var(--emerald-light)!important;border-color:var(--emerald)!important;color:#065f46!important}
.match-item.wrong{background:var(--red-light)!important;border-color:var(--red)!important;color:#991b1b!important}
.match-item:disabled,.match-item[disabled]{cursor:default;opacity:.7}

/* ═══ FLASHCARD ═══ */
.flashcard-container{perspective:800px;margin:0 auto;max-width:400px}
.flashcard{width:100%;min-height:200px;position:relative;cursor:pointer;transition:transform .6s;transform-style:preserve-3d}
.flashcard.flipped{transform:rotateY(180deg)}
[dir="rtl"] .flashcard.flipped{transform:rotateY(-180deg)}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.flashcard-front{background:linear-gradient(135deg,#06b6d4,#0284c7);color:var(--white);font-size:20px;font-weight:700}
.flashcard-back{background:var(--white);border:2px solid var(--cyan);color:#0f172a;transform:rotateY(180deg);font-size:14px;line-height:1.7}
[dir="rtl"] .flashcard-back{transform:rotateY(-180deg)}
.flashcard-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px}
.flashcard-counter{font-size:13px;font-weight:600;color:var(--slate)}

/* ═══ QUIZ ═══ */
.quiz-option{width:100%;text-align:left;padding:10px 14px;border-radius:8px;border:2px solid #e2e8f0;font-size:13px;transition:.2s;margin-bottom:6px;display:flex;align-items:center;gap:8px}
[dir="rtl"] .quiz-option{text-align:right}
.quiz-option:hover:not(:disabled){border-color:var(--cyan);background:var(--cyan-light)}
.quiz-option.selected{border-color:var(--cyan);background:var(--cyan-light);font-weight:600}
.quiz-option.correct{border-color:var(--emerald);background:var(--emerald-light);color:#065f46}
.quiz-option.wrong{border-color:var(--red);background:var(--red-light);color:#991b1b}
.quiz-option:disabled{cursor:default}
.quiz-radio{width:16px;height:16px;border-radius:50%;border:2px solid #cbd5e1;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.quiz-option.selected .quiz-radio{border-color:var(--cyan);background:var(--cyan)}
.quiz-option.selected .quiz-radio::after{content:'';width:6px;height:6px;background:#fff;border-radius:50%}
.quiz-result{text-align:center;padding:16px;border-radius:var(--radius);margin-top:12px;font-weight:700;font-size:15px}
.quiz-result.pass{background:var(--emerald-light);border:1px solid #6ee7b7;color:#065f46}
.quiz-result.fail{background:var(--red-light);border:1px solid #fca5a5;color:#991b1b}

/* ═══ ANIMATIONS ═══ */
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeIn .4s ease forwards}
.hidden{display:none!important}

/* ═══ SCORM STATUS ═══ */
.scorm-status{position:fixed;bottom:8px;right:8px;padding:4px 10px;border-radius:6px;font-size:10px;font-weight:600;z-index:999}
[dir="rtl"] .scorm-status{right:auto;left:8px}
.scorm-status.connected{background:#d1fae5;color:#065f46}
.scorm-status.disconnected{background:#fee2e2;color:#991b1b}

.drag-pool{display:flex;flex-direction:column;gap:6px}
.drag-item{padding:10px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:2px solid #e2e8f0;background:#fff;user-select:none;transition:.2s}
.drag-item:hover{border-color:var(--cyan);background:var(--cyan-light)}
.drag-item.correct{background:var(--emerald-light);border-color:var(--emerald);color:#065f46}
.drag-item.wrong{background:var(--red-light);border-color:var(--red);color:#991b1b}

</style>
</head>

<div class="app" id="app"></div>
<div class="scorm-status" id="scormStatus"></div>
<script>

/* ═══════════════════════════════════════════════════════════════
   SCORM 1.2 API WRAPPER
   ═══════════════════════════════════════════════════════════════ */
const SCORM = (() => {
  let API = null;
  let connected = false;

  function findAPI(win) {
    let tries = 0;
    while (win && !win.API && tries < 10) {
      tries++;
      if (win.parent && win.parent !== win) { win = win.parent; }
      else if (win.opener) { win = win.opener; }
      else break;
    }
    return win?.API || null;
  }

  function init() {
    API = findAPI(window);
    if (!API && window.opener) API = findAPI(window.opener);
    if (API) {
      const r = API.LMSInitialize('');
      connected = (r === 'true' || r === true);
    }
    updateStatusUI();
    return connected;
  }

  function setValue(key, val) {
    if (!API) return;
    API.LMSSetValue(key, String(val));
    API.LMSCommit('');
  }

  function getValue(key) {
    if (!API) return '';
    return API.LMSGetValue(key);
  }

  function setScore(score, max, min) {
    setValue('cmi.core.score.raw', score);
    setValue('cmi.core.score.max', max || 100);
    setValue('cmi.core.score.min', min || 0);
  }

  function setStatus(status) {
    // status: 'completed', 'incomplete', 'passed', 'failed', 'not attempted'
    setValue('cmi.core.lesson_status', status);
  }

  function setLocation(loc) {
    setValue('cmi.core.lesson_location', loc);
  }

  function getLocation() {
    return getValue('cmi.core.lesson_location') || '';
  }

  function setSuspendData(data) {
    setValue('cmi.suspend_data', typeof data === 'string' ? data : JSON.stringify(data));
  }

  function getSuspendData() {
    const d = getValue('cmi.suspend_data');
    try { return JSON.parse(d); } catch(e) { return d || null; }
  }

  function finish() {
    if (API) {
      API.LMSCommit('');
      API.LMSFinish('');
    }
  }

  function updateStatusUI() {
    const el = document.getElementById('scormStatus');
    if (el) {
      el.textContent = connected ? 'SCORM Connected' : 'SCORM: Standalone';
      el.className = 'scorm-status ' + (connected ? 'connected' : 'disconnected');
    }
  }

  return { init, setValue, getValue, setScore, setStatus, setLocation, getLocation, setSuspendData, getSuspendData, finish, get connected(){ return connected; } };
})();

  // Summary slide
  var h='<div style="text-align:center"><h2 class="slide-title">\ud83d\udccb '+(S.lang==='ar'?'\u0645\u0644\u062e\u0635 \u0627\u0644\u0648\u062d\u062f\u0629':'Module Summary')+'</h2><p class="slide-subtitle">'+(S.lang==='ar'?'\u0645\u0631\u0627\u062c\u0639\u0629 \u0627\u0644\u0646\u0642\u0627\u0637 \u0627\u0644\u0631\u0626\u064a\u0633\u064a\u0629 \u0642\u0628\u0644 \u0627\u0644\u0627\u062e\u062a\u0628\u0627\u0631':'Review key points before the quiz')+'</p><div style="text-align:left;max-width:600px;margin:16px auto">';
  for(var i=0;i<qs.length;i++){
    h+='<div class="info-box cyan" style="margin-bottom:8px"><strong>'+(i+1)+'. </strong>'+qs[i].q+'<br><span style="color:var(--emerald);font-weight:600">\u2705 '+qs[i].opts[qs[i].correct]+'</span></div>';
  }
  return h+'</div></div>';
}

function render(){
  var dir=isRTL()?'rtl':'ltr';
  document.documentElement.dir=dir;
  document.documentElement.lang=S.lang;
  var p=S.page,pType=PAGE_TYPES[p];
  S.visited[p]=true;
  var title=getTitle();
  var headerLabel='',headerColor='badge-cyan';
  if(pType==='slide'){headerLabel='\ud83d\udcd6 '+(S.lang==='ar'?'\u0627\u0644\u0634\u0631\u064a\u062d\u0629 ':'Slide ')+(p+1)}
  else if(pType.indexOf('activity')===0){var act=getAct(p);headerLabel=act?(S.lang==='ar'?act.title_ar:act.title_en):'Activity';headerColor='badge-amber'}
  else if(pType==='module-quiz'){headerLabel=l('quiz');headerColor='badge-emerald'}
  
  var prevBtn='<button class="btn btn-outline" '+(p===0?'disabled':'')+' onclick="goTo('+(p-1)+')">'+(isRTL()?'\u2192':'\u2190')+' '+l('prev')+'</button>';
  var nextBtn=p<TOTAL_PAGES-1?'<button class="btn btn-primary" onclick="goTo('+(p+1)+')">'+l('next')+' '+(isRTL()?'\u2190':'\u2192')+'</button>':'<button class="btn btn-success" disabled>\u2713 '+l('score')+'</button>';
  var dots='';
  for(var i=0;i<TOTAL_PAGES;i++){
    var cls='nav-dot';
    if(i===p)cls+=' active';else if(S.visited[i])cls+=' visited';
    if(PAGE_TYPES[i].indexOf('activity')===0)cls+=' section-activity';
    else if(PAGE_TYPES[i]==='module-quiz')cls+=' section-quiz';
    dots+='<button class="'+cls+'" onclick="goTo('+i+')" title="'+(i+1)+'/'+TOTAL_PAGES+'"></button>';
  }
  var bodyHTML='';
  if(pType==='slide')bodyHTML=slideContent(p);
  else if(pType==='activity-match')bodyHTML=renderMatch(p);
  else if(pType==='activity-flashcard')bodyHTML=renderFlash(p);
  else if(pType==='activity-dragdrop')bodyHTML=renderDrag(p);
  else if(pType==='module-quiz')bodyHTML=renderQuiz();
  
  document.getElementById('app').innerHTML=
    '<div class="toolbar"><h1>'+l('mod')+' '+MOD_NUM+': '+title+'</h1><button class="lang-btn" onclick="toggleLang()">'+(S.lang==='en'?'\u0627\u0644\u0639\u0631\u0628\u064a\u0629':'English')+'</button></div>'+
    '<div class="progress-bar"><div class="progress-fill" style="width:'+Math.round(((p+1)/TOTAL_PAGES)*100)+'%"></div></div>'+
    '<div class="nav-dots">'+dots+'</div>'+
    '<div class="card"><div class="card-header"><span class="badge '+headerColor+'">'+headerLabel+'</span><span style="font-size:11px;color:#94a3b8;font-weight:600">'+(p+1)+' '+l('of')+' '+TOTAL_PAGES+'</span></div>'+
    '<div class="card-body animate-in" id="pageBody">'+bodyHTML+'</div>'+
    '<div class="card-footer">'+prevBtn+'<span style="font-size:11px;color:#94a3b8">'+(p+1)+'/'+TOTAL_PAGES+'</span>'+nextBtn+'</div></div>';
}

/* MATCH */
function renderMatch(pageIdx){
  var act=getAct(pageIdx);if(!act)return'';
  var pairs=S.lang==='ar'?act.pairs_ar:act.pairs_en;
  var title=S.lang==='ar'?act.title_ar:act.title_en;
  var desc=S.lang==='ar'?act.desc_ar:act.desc_en;
  var matched=S.matchPairs,done=S.matchDone;
  function isLM(i){for(var j=0;j<matched.length;j++)if(matched[j].left===i)return true;return false}
  function isRM(i){for(var j=0;j<matched.length;j++)if(matched[j].right===i)return true;return false}
  var rightShuffled=pairs.map(function(p,i){return{text:p[1],idx:i}}).sort(function(a,b){return(a.idx+3)%6-(b.idx+3)%6});
  var h='<div style="max-width:700px;margin:0 auto"><h2 class="slide-title">'+title+'</h2><p class="slide-subtitle">'+desc+'</p>';
  if(done)h+='<div class="info-box emerald" style="text-align:center;font-weight:700">\u2705 '+l('md')+'</div>';
  h+='<div class="grid-2"><div class="match-pool">';
  for(var i=0;i<pairs.length;i++){
    var m=isLM(i),sel=S.matchSel.left===i;
    h+='<button class="match-item left '+(m?'correct':'')+' '+(sel?'selected':'')+'" '+(m?'disabled':'')+' onclick="matchSel(\'left\','+i+')">'+pairs[i][0]+'</button>';
  }
  h+='</div><div class="match-pool">';
  for(var i=0;i<rightShuffled.length;i++){
    var item=rightShuffled[i],m=isRM(item.idx),sel=S.matchSel.right===item.idx;
    h+='<button class="match-item right '+(m?'correct':'')+' '+(sel?'selected':'')+'" '+(m?'disabled':'')+' onclick="matchSel(\'right\','+item.idx+')">'+item.text+'</button>';
  }
  h+='</div></div>';
  if(done)h+='<div style="text-align:center;margin-top:12px"><button class="btn btn-outline" onclick="resetMatch()">\ud83d\udd04 '+l('reset')+'</button></div>';
  return h+'</div>';
}

/* FLASHCARD */
function renderFlash(pageIdx){
  var act=getAct(pageIdx);if(!act)return'';
  var cards=S.lang==='ar'?act.cards_ar:act.cards_en;
  var title=S.lang==='ar'?act.title_ar:act.title_en;
  var desc=S.lang==='ar'?act.desc_ar:act.desc_en;
  var icons=act.icons||['\ud83d\udcd6','\ud83d\udcd6','\ud83d\udcd6','\ud83d\udcd6','\ud83d\udcd6'];
  var idx=S.flashIdx,fl=S.flashFlipped,card=cards[idx];
  return '<div style="max-width:500px;margin:0 auto;text-align:center"><h2 class="slide-title">'+title+'</h2><p class="slide-subtitle">'+desc+'</p>'+
    '<div class="flashcard-container"><div class="flashcard '+(fl?'flipped':'')+'" onclick="toggleFlash()">'+
    '<div class="flashcard-face flashcard-front"><div style="font-size:28px;margin-bottom:8px">'+(icons[idx]||'\ud83d\udcd6')+'</div>'+card[0]+'<div style="font-size:11px;margin-top:8px;opacity:.7">'+l('flip')+'</div></div>'+
    '<div class="flashcard-face flashcard-back">'+card[1]+'</div></div></div>'+
    '<div class="flashcard-nav"><button class="btn btn-outline" onclick="flashPrev()" '+(idx===0?'disabled':'')+'>'+(isRTL()?'\u2192':'\u2190')+'</button>'+
    '<span class="flashcard-counter">'+(idx+1)+' / '+cards.length+'</span>'+
    '<button class="btn btn-outline" onclick="flashNext()" '+(idx===cards.length-1?'disabled':'')+'>'+(isRTL()?'\u2190':'\u2192')+'</button></div></div>';
}

/* DRAG-DROP ORDER */
function renderDrag(pageIdx){
  var act=getAct(pageIdx);if(!act)return'';
  var items=S.lang==='ar'?act.items_ar:act.items_en;
  var title=S.lang==='ar'?act.title_ar:act.title_en;
  var desc=S.lang==='ar'?act.desc_ar:act.desc_en;
  if(S.dragOrder.length!==items.length){
    S.dragOrder=items.map(function(_,i){return i});
    for(var i=S.dragOrder.length-1;i>0;i--){var j=(i*3+2)%S.dragOrder.length;var tmp=S.dragOrder[i];S.dragOrder[i]=S.dragOrder[j];S.dragOrder[j]=tmp}
  }
  var h='<div style="max-width:600px;margin:0 auto"><h2 class="slide-title">'+title+'</h2><p class="slide-subtitle">'+desc+'</p><div class="drag-pool">';
  for(var pos=0;pos<S.dragOrder.length;pos++){
    var origIdx=S.dragOrder[pos];
    var cls='drag-item';
    if(S.dragChecked)cls+=origIdx===pos?' correct':' wrong';
    h+='<div class="'+cls+'" style="display:flex;justify-content:space-between;align-items:center"><span>'+(pos+1)+'. '+items[origIdx]+'</span>';
    if(!S.dragChecked){
      h+='<span style="display:flex;gap:4px">';
      if(pos>0)h+='<button class="btn btn-outline" style="padding:4px 8px;font-size:11px" onclick="dragMove('+pos+','+(pos-1)+')">\u2191</button>';
      if(pos<items.length-1)h+='<button class="btn btn-outline" style="padding:4px 8px;font-size:11px" onclick="dragMove('+pos+','+(pos+1)+')">\u2193</button>';
      h+='</span>';
    }else{h+=origIdx===pos?'\u2705':'\u274c'}
    h+='</div>';
  }
  h+='</div>';
  if(!S.dragChecked){
    h+='<div style="text-align:center;margin-top:12px"><button class="btn btn-primary" onclick="checkDrag()">'+l('co')+'</button></div>';
  }else{
    var cc=0;for(var i=0;i<S.dragOrder.length;i++)if(S.dragOrder[i]===i)cc++;
    var allC=cc===items.length;
    h+='<div class="info-box '+(allC?'emerald':'amber')+'" style="text-align:center;margin-top:12px;font-weight:700">'+(allC?'\u2705 '+l('correct'):cc+'/'+items.length+' '+l('correct'))+'</div>';
    h+='<div style="text-align:center;margin-top:8px"><button class="btn btn-outline" onclick="resetDrag()">\ud83d\udd04 '+l('tad')+'</button></div>';
  }
  return h+'</div>';
}

/* MODULE QUIZ */
function renderQuiz(){
  var qs=S.lang==='ar'?MOD_QUIZ_AR:MOD_QUIZ_EN;
  var ans=S.quizAns,submitted=S.quizSubmitted;
  var h='<div style="max-width:700px;margin:0 auto"><div style="text-align:center;margin-bottom:16px"><div class="badge badge-emerald" style="margin-bottom:8px">\ud83d\udcdd '+l('quiz')+'</div><h2 class="slide-title">'+getTitle()+'</h2><p class="slide-subtitle">'+l('qd')+'</p><div class="badge badge-amber">'+l('pt')+'</div></div>';
  for(var qi=0;qi<qs.length;qi++){
    var q=qs[qi];
    h+='<div style="margin-bottom:16px"><p style="font-size:13px;font-weight:600;margin-bottom:8px"><span style="color:#0891b2;font-weight:700">Q'+(qi+1)+'.</span> '+q.q+'</p><div style="padding-'+(isRTL()?'right':'left')+':20px">';
    for(var oi=0;oi<q.opts.length;oi++){
      var sel=ans[qi]===oi,isC=submitted&&q.correct===oi,isW=submitted&&sel&&q.correct!==oi;
      var cls='quiz-option';
      if(isC)cls+=' correct';else if(isW)cls+=' wrong';else if(sel&&!submitted)cls+=' selected';
      h+='<button class="'+cls+'" onclick="'+(submitted?'':'selQuiz('+qi+','+oi+')')+'" '+(submitted?'disabled':'')+'><div class="quiz-radio"></div>'+(submitted&&isC?'\u2713 ':'')+(submitted&&isW?'\u2717 ':'')+q.opts[oi]+'</button>';
    }
    h+='</div></div>';
  }
  var resultHTML='';
  if(submitted){var pct=S.quizScore,pass=pct>=80;resultHTML='<div class="quiz-result '+(pass?'pass':'fail')+'">'+(pass?'\u2705':'\u274c')+' '+l('score')+': '+pct+'%<br><span style="font-size:13px;font-weight:400">'+(pass?l('pass'):l('fail'))+'</span></div>'}
  var ac=0;for(var k in ans)ac++;
  h+='<div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid #e2e8f0">';
  if(submitted){h+='<span style="font-size:12px;color:#64748b">'+(S.quizScore>=80?'\u2713 ':'')+l('score')+': '+S.quizScore+'%</span><button class="btn btn-outline" onclick="resetQuiz()">\ud83d\udd04 '+l('tryAgain')+'</button>'}
  else{h+='<span style="font-size:11px;color:#94a3b8">'+ac+' '+l('of')+' '+qs.length+' '+l('ans')+'</span><button class="btn btn-primary" onclick="submitQuiz()" '+(ac===qs.length?'':'disabled')+'>'+l('check')+'</button>'}
  return h+'</div>'+resultHTML+'</div>';
}

/* HANDLERS */
function goTo(p){if(p<0||p>=TOTAL_PAGES)return;S.page=p;SCORM.setLocation(String(p));saveProg();render()}
function toggleLang(){S.lang=S.lang==='en'?'ar':'en';S.matchSel={left:null,right:null};S.matchPairs=[];S.matchDone=false;S.flashIdx=0;S.flashFlipped=false;S.dragOrder=[];S.dragChecked=false;render()}
function matchSel(side,idx){
  if(S.matchDone)return;S.matchSel[side]=idx;
  if(S.matchSel.left!==null&&S.matchSel.right!==null){
    var act=getAct(S.page),pairs=S.lang==='ar'?act.pairs_ar:act.pairs_en;
    var li=S.matchSel.left,ri=S.matchSel.right;
    if(pairs[li][1]===pairs[ri][1])S.matchPairs.push({left:li,right:ri});
    var uL={};for(var i=0;i<S.matchPairs.length;i++)uL[S.matchPairs[i].left]=true;
    if(Object.keys(uL).length===pairs.length)S.matchDone=true;
    S.matchSel={left:null,right:null};setTimeout(render,100);
  }else render();
}
function resetMatch(){S.matchSel={left:null,right:null};S.matchPairs=[];S.matchDone=false;render()}
function toggleFlash(){S.flashFlipped=!S.flashFlipped;render()}
function flashPrev(){if(S.flashIdx>0){S.flashIdx--;S.flashFlipped=false;render()}}
function flashNext(){var act=getAct(S.page),cards=S.lang==='ar'?act.cards_ar:act.cards_en;if(S.flashIdx<cards.length-1){S.flashIdx++;S.flashFlipped=false;render()}}
function dragMove(from,to){var tmp=S.dragOrder[from];S.dragOrder[from]=S.dragOrder[to];S.dragOrder[to]=tmp;render()}
function checkDrag(){S.dragChecked=true;render()}
function resetDrag(){S.dragOrder=[];S.dragChecked=false;render()}
function selQuiz(qi,oi){if(S.quizSubmitted)return;S.quizAns[qi]=oi;render()}
function submitQuiz(){
  var qs=S.lang==='ar'?MOD_QUIZ_AR:MOD_QUIZ_EN;var c=0;
  for(var i=0;i<qs.length;i++)if(S.quizAns[i]===qs[i].correct)c++;
  var pct=Math.round((c/qs.length)*100);
  S.quizScore=pct;S.quizSubmitted=true;
  SCORM.setScore(pct,100,0);SCORM.setStatus(pct>=80?'passed':'failed');
  saveProg();render();
}
function resetQuiz(){S.quizAns={};S.quizSubmitted=false;S.quizScore=0;render()}

function saveProg(){
  SCORM.setSuspendData({lang:S.lang,page:S.page,visited:S.visited,quizAns:S.quizAns,quizSubmitted:S.quizSubmitted,quizScore:S.quizScore});
}
function loadProg(){
  var d=SCORM.getSuspendData();
  if(d&&typeof d==='object'){
    if(d.lang)S.lang=d.lang;if(d.page!==undefined)S.page=d.page;
    if(d.visited)S.visited=d.visited;
    if(d.quizAns)S.quizAns=d.quizAns;
    if(d.quizSubmitted)S.quizSubmitted=d.quizSubmitted;
    if(d.quizScore)S.quizScore=d.quizScore;
  }else{var loc=SCORM.getLocation();if(loc)S.page=parseInt(loc)||0}
}

window.addEventListener('load',function(){
  SCORM.init();loadProg();
  if(!S.quizSubmitted)SCORM.setStatus('incomplete');
  render();
});
window.addEventListener('beforeunload',function(){saveProg();SCORM.finish()});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();goTo(S.page+1)}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();goTo(S.page-1)}
});

</script>
</body>
</html>
